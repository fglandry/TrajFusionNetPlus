model_opts:
  model: TrajectoryTransformerGraph
  apply_class_weights: True
  generator: True
  obs_input_type: [scene_video_with_segmentation_v0,
                   scene_graph_v2,
                   box, normalized_abs_box, speed]
  frameworks:
    pytorch: True
    hugging_faces: True
    multi-gpu: False
  process_input_features:
    enabled: True
    indexes_to_stack: [2, 3, 4]
    static_features_indexes: []
exp_opts:
  datasets: [pie]
  batch_size: [64]
  epochs: [40]
  lr: [5.0e-05]
